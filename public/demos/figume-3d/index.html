<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiguME-3D • İnteraktif 3D Karakter Simülatörü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .glass-panel {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-glow {
      animation: pulse-ring 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="relative">

  <div id="canvas-container"></div>

  <!-- Top Floating HUD -->
  <div class="absolute top-6 left-6 right-6 flex items-center justify-between pointer-events-none z-10">
    <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 pointer-events-auto shadow-xl">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      <div>
        <h1 class="text-xs font-bold tracking-wider uppercase">FiguME-3D</h1>
        <p class="text-[10px] text-zinc-400 font-mono">SwiftUI & 3D Interactive Engine</p>
      </div>
    </div>

    <div class="glass-panel px-3 py-1.5 rounded-xl text-[11px] font-mono text-zinc-300 pointer-events-auto hidden sm:block">
      FPS: <span id="fps-counter" class="text-white font-bold">60</span> • 3D Render
    </div>
  </div>

  <!-- Bottom Floating Controls -->
  <div class="absolute bottom-6 inset-x-0 flex justify-center px-4 pointer-events-none z-10">
    <div class="glass-panel p-3 rounded-2xl flex flex-wrap items-center justify-center gap-2 sm:gap-3 pointer-events-auto shadow-2xl max-w-lg">
      <button id="btn-spin" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-semibold tracking-wide border border-white/20 transition-all">
        🔄 Döndür
      </button>
      <button id="btn-sound" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-semibold tracking-wide border border-white/20 transition-all flex items-center gap-1.5">
        🔊 <span id="sound-label">Ses Efekti</span>
      </button>
      <button id="btn-color" class="px-3.5 py-2 rounded-xl bg-white text-black hover:bg-zinc-200 active:scale-95 text-xs font-bold tracking-wide transition-all">
        ✨ Işık Değiştir
      </button>
      <button id="btn-jump" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-semibold tracking-wide border border-white/20 transition-all">
        ⚡ Zıplat
      </button>
    </div>
  </div>

  <!-- Speech Bubble -->
  <div id="speech-bubble" class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 glass-panel px-4 py-2 rounded-2xl text-xs font-medium text-white shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-20">
    Merhaba! Ben FiguME 3D Figürün. 👋
  </div>

  <script>
    // 3D Scene Initialization
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 5.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Grid Floor
    const gridHelper = new THREE.GridHelper(20, 20, 0x555555, 0x222222);
    gridHelper.position.y = -1.2;
    scene.add(gridHelper);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 2, 10);
    pointLight.position.set(0, 2, 2);
    scene.add(pointLight);

    // Create 3D Figurine Character (Hello Kitty / Chibi style)
    const characterGroup = new THREE.Group();

    const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.1 });
    const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8 });
    const matPink = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.3 });

    // Head
    const headGeo = new THREE.SphereGeometry(0.85, 32, 32);
    headGeo.scale(1.15, 0.95, 0.95);
    const head = new THREE.Mesh(headGeo, matWhite);
    head.position.y = 0.8;
    characterGroup.add(head);

    // Ears
    const earGeo = new THREE.ConeGeometry(0.3, 0.55, 32);
    const leftEar = new THREE.Mesh(earGeo, matWhite);
    leftEar.position.set(-0.65, 1.6, 0);
    leftEar.rotation.z = 0.35;
    characterGroup.add(leftEar);

    const rightEar = new THREE.Mesh(earGeo, matWhite);
    rightEar.position.set(0.65, 1.6, 0);
    rightEar.rotation.z = -0.35;
    characterGroup.add(rightEar);

    // Bow (Ribbon)
    const bowCenterGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const bowCenter = new THREE.Mesh(bowCenterGeo, matPink);
    bowCenter.position.set(0.6, 1.45, 0.45);
    characterGroup.add(bowCenter);

    const bowSideGeo = new THREE.ConeGeometry(0.2, 0.35, 16);
    const bowLeft = new THREE.Mesh(bowSideGeo, matPink);
    bowLeft.position.set(0.45, 1.5, 0.4);
    bowLeft.rotation.z = 1.3;
    characterGroup.add(bowLeft);

    const bowRight = new THREE.Mesh(bowSideGeo, matPink);
    bowRight.position.set(0.75, 1.4, 0.4);
    bowRight.rotation.z = -1.3;
    characterGroup.add(bowRight);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.08, 16, 16);
    eyeGeo.scale(0.8, 1.4, 0.5);
    const leftEye = new THREE.Mesh(eyeGeo, matBlack);
    leftEye.position.set(-0.35, 0.75, 0.82);
    characterGroup.add(leftEye);

    const rightEye = new THREE.Mesh(eyeGeo, matBlack);
    rightEye.position.set(0.35, 0.75, 0.82);
    characterGroup.add(rightEye);

    // Nose
    const noseGeo = new THREE.SphereGeometry(0.07, 16, 16);
    noseGeo.scale(1.2, 0.7, 0.6);
    const nose = new THREE.Mesh(noseGeo, matGold);
    nose.position.set(0, 0.62, 0.88);
    characterGroup.add(nose);

    // Body
    const bodyGeo = new THREE.CylinderGeometry(0.45, 0.65, 0.9, 32);
    const body = new THREE.Mesh(bodyGeo, matWhite);
    body.position.y = -0.15;
    characterGroup.add(body);

    // Arms
    const armGeo = new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.12, 0.35, 8, 16) : new THREE.CylinderGeometry(0.12, 0.12, 0.45, 16);
    const leftArm = new THREE.Mesh(armGeo, matWhite);
    leftArm.position.set(-0.6, -0.15, 0.1);
    leftArm.rotation.z = 0.5;
    characterGroup.add(leftArm);

    const rightArm = new THREE.Mesh(armGeo, matWhite);
    rightArm.position.set(0.6, -0.15, 0.1);
    rightArm.rotation.z = -0.5;
    characterGroup.add(rightArm);

    // Feet
    const footGeo = new THREE.SphereGeometry(0.22, 16, 16);
    footGeo.scale(1, 0.6, 1.4);
    const leftFoot = new THREE.Mesh(footGeo, matWhite);
    leftFoot.position.set(-0.35, -0.75, 0.15);
    characterGroup.add(leftFoot);

    const rightFoot = new THREE.Mesh(footGeo, matWhite);
    rightFoot.position.set(0.35, -0.75, 0.15);
    characterGroup.add(rightFoot);

    // Base Pedestal
    const baseGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.15, 32);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x222225, metalness: 0.8, roughness: 0.2 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = -0.9;
    characterGroup.add(base);

    // Glowing Hologram Ring
    const ringGeo = new THREE.RingGeometry(1.35, 1.45, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -0.88;
    characterGroup.add(ring);

    scene.add(characterGroup);

    // Mouse Interaction / Drag to Rotate
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let targetRotationY = 0;
    let targetRotationX = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) {
        // Subtle tilt towards cursor
        const normX = (e.clientX / window.innerWidth) * 2 - 1;
        const normY = -(e.clientY / window.innerHeight) * 2 + 1;
        characterGroup.rotation.y = normX * 0.4;
        head.rotation.x = normY * 0.2;
        head.rotation.y = normX * 0.3;
        return;
      }
      const deltaX = e.clientX - prevMouseX;
      const deltaY = e.clientY - prevMouseY;
      targetRotationY += deltaX * 0.01;
      targetRotationX += deltaY * 0.01;
      targetRotationX = Math.max(-0.5, Math.min(0.5, targetRotationX));
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Touch events for mobile
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const normX = (touch.clientX / window.innerWidth) * 2 - 1;
        characterGroup.rotation.y = normX * 0.8;
      }
    });

    // Sound Synthesizer (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const phrases = [
      "Merhaba! Ben FiguME 3D Figürün. 👋",
      "SwiftUI ile 120 FPS akıcılık! 🚀",
      "Beni 360° çevirebilirsin! 🔄",
      "iOS için harika bir 3D deneyim! 📱",
      "Mırr... Çok teşekkürler! ✨"
    ];

    function showSpeech() {
      const bubble = document.getElementById('speech-bubble');
      const phrase = phrases[Math.floor(Math.random() * phrases.length)];
      bubble.innerText = phrase;
      bubble.style.opacity = '1';
      bubble.style.transform = 'translate(-50%, -80px) scale(1.05)';
      setTimeout(() => {
        bubble.style.opacity = '0';
        bubble.style.transform = 'translate(-50%, -50%) scale(1)';
      }, 2500);
    }

    // Button Listeners
    document.getElementById('btn-spin').addEventListener('click', () => {
      targetRotationY += Math.PI * 2;
      playBeep(440);
      showSpeech();
    });

    document.getElementById('btn-sound').addEventListener('click', () => {
      playBeep(587.33, 'triangle', 0.1);
      setTimeout(() => playBeep(880, 'sine', 0.2), 100);
      showSpeech();
    });

    const colors = [0xffffff, 0x60a5fa, 0xa78bfa, 0x34d399, 0xf472b6];
    let colorIdx = 0;
    document.getElementById('btn-color').addEventListener('click', () => {
      colorIdx = (colorIdx + 1) % colors.length;
      pointLight.color.setHex(colors[colorIdx]);
      ringMat.color.setHex(colors[colorIdx]);
      playBeep(659.25);
    });

    let isJumping = false;
    let jumpTime = 0;
    document.getElementById('btn-jump').addEventListener('click', () => {
      if (!isJumping) {
        isJumping = true;
        jumpTime = 0;
        playBeep(523.25);
        showSpeech();
      }
    });

    // Animation Loop
    let lastTime = performance.now();
    let frameCount = 0;
    const fpsElem = document.getElementById('fps-counter');

    function animate(now) {
      requestAnimationFrame(animate);

      // Smooth rotation lerp
      if (isDragging) {
        characterGroup.rotation.y += (targetRotationY - characterGroup.rotation.y) * 0.1;
        characterGroup.rotation.x += (targetRotationX - characterGroup.rotation.x) * 0.1;
      }

      // Idle breathing
      const time = now * 0.002;
      head.position.y = 0.8 + Math.sin(time) * 0.02;
      body.scale.y = 1 + Math.sin(time) * 0.015;
      ring.scale.setScalar(1 + Math.sin(time * 2) * 0.05);

      // Jump Animation
      if (isJumping) {
        jumpTime += 0.08;
        characterGroup.position.y = Math.sin(jumpTime) * 0.8;
        if (jumpTime >= Math.PI) {
          isJumping = false;
          characterGroup.position.y = 0;
        }
      }

      renderer.render(scene, camera);

      // FPS calc
      frameCount++;
      if (now - lastTime >= 1000) {
        if (fpsElem) fpsElem.innerText = frameCount;
        frameCount = 0;
        lastTime = now;
      }
    }

    animate(performance.now());

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
